[project]
name = "jsonette"
version = "0.1.0"
description = "SIMD-accelerated JSON parser for Mojo"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mojox>=0.5",
    "mojo-compiler==1.0.0",
    "mojo-compiler-mojo-libs==1.0.0",
]

[dependency-groups]
# Developer toolchain: mojo-lsp-server, mojo-lldb, lldb-dap and the mblack
# formatter. Not the compiler -- mojo-compiler above provides that.
dev = [
    "mojo==1.0.0",
]

[build-system]
# mojo-compiler-mojo-libs is a transitive pre-release dep of mojo-compiler;
# build-isolation environments can't opt into pre-releases automatically, so
# it must be pinned explicitly here.
requires = [
    "mojox-build>=0.5",
    "mojox-core>=0.5",
    "mojo-compiler==1.0.0",
    "mojo-compiler-mojo-libs==1.0.0",
]
build-backend = "mojox_build"

[tool.uv]
prerelease = "allow"

[tool.mojox]
packages = ["jsonette"]
test-parallel = true

[tool.mojox.lints]
warnings = "error"

# The DOM writer and the reflective walk recurse once per nesting level, and an
# unoptimised frame is large enough that the documented `_MAX_DEPTH` of 1024
# exhausts the default 8 MB stack before the guard can raise -- adversarial
# deep-nesting tests segfault instead of getting a clean error. -O1 shrinks the
# frames enough for the guard to hold; the release build is unaffected.
[tool.mojox.profile.dev]
optimize = 1
